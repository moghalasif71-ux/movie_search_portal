<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Movie Search</h1>
    <form id="search-form">
      <input id="query" type="search" placeholder="Search a movie, e.g. Baahubali" required>
      <button type="submit">Search</button>
    </form>
    <nav>
      <button id="tab-results" class="tab active">Results</button>
      <button id="tab-favs" class="tab">Favourites <span id="fav-count">0</span></button>
    </nav>
  </header>

  <main>
    <p id="status" role="status"></p>
    <section id="grid" class="grid"></section>
  </main>

  <dialog id="modal">
    <button id="close" aria-label="Close">&times;</button>
    <div id="modal-body"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
